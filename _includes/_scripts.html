<script>
$(function() {
  $('pre').each(function() {
    var $pre = $(this);
    if ($pre.find('code.language-no-copy').length) return;
    var $btn = $('<button class="copy-code-btn" title="Copy to clipboard"><i class="fa fa-copy"></i></button>');
    // the button lives in a wrapper *next to* the <pre>, not inside it: the <pre>
    // is the horizontal scroll container, and an absolutely positioned child of it
    // scrolls away with the content when a long line is scrolled into view.
    $pre.wrap('<div class="code-block-wrap"></div>').parent().append($btn);
    $btn.on('click', function() {
      var code = ($pre.find('code').length ? $pre.find('code').text() : $pre.text()).replace(/\n$/, '');
      navigator.clipboard.writeText(code).then(function() {
        $btn.find('i').removeClass('fa-copy').addClass('fa-check');
        setTimeout(function() {
          $btn.find('i').removeClass('fa-check').addClass('fa-copy');
        }, 1500);
      });
    });
  });
});
</script>
<script>
// focus mode: hides the left panel and the TOC and lets the article fill the
// page, so tutorials can be zoomed in and projected for a room.
$(function() {
  var $exit = $('<button type="button" class="focus-mode-exit" title="Exit focus mode (Esc)"><i class="fa fa-compress"></i></button>').appendTo('body');
  function setFocus(on) { $('body').toggleClass('focus-mode', on); }
  $('.focus-mode-btn').on('click', function() { setFocus(true); });
  $exit.on('click', function() { setFocus(false); });
  $(document).on('keydown', function(e) { if (e.key === 'Escape') setFocus(false); });
});
</script>
