# Site wide configuration

title:            Meren Lab
locale:           en_US
url:              https://merenlab.org

# Jekyll configuration
permalink: /blog/:title/

markdown:    kramdown

highlighter: rouge

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-gist

whitelist:
  - jekyll-redirect-from

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false


# Site owner
owner:
  name: Meren Lab
  email: a.murat.eren@gmail.com
  disqus-shortname: merensgithub

# The license statement shown in the footer bar at the bottom of every page. A page
# can override it with its own `license:` in its front matter, or hide the bar
# with `license: false`. See web-tips.md for details.
default_license: 'Contents of this page are licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="license noopener">CC BY 4.0</a>; feel free to share and adapt it for any purpose.'

include: [".htaccess"]
exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", "less", "*.sublime-project", "*.sublime-workspace", "test", "spec", "Gruntfile.js", "package.json", "node_modules", "Gemfile", "Gemfile.lock", "LICENSE", "README.md"]
